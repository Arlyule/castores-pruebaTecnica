spring.application.name=Castores_prueba
# =========================================
# VARIABLES
# =========================================
database.name=castores_inventario
database.port=3306
database.host=localhost

# =========================================
# DATOS DE CONEXION MYSQL
# =========================================
spring.datasource.url=jdbc:mysql://${database.host}:${database.port}/${database.name}?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=kafka
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================
# JPA / HIBERNATE
# =========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================
# DIALECTO MYSQL
# =========================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =========================================
#  JWT
# =========================================
jwt.secret=MiClaveUltraSeguraParaJWT2026SpringBootCastores
jwt.expiration=1200000